# Servicios de infraestructura para desarrollo local.
# PostgreSQL corre en el puerto 5433 del host para no chocar con la instalación local (5432).
# Las apps (api, web, worker) se contenerizan más adelante.
services:
  postgres:
    image: postgres:19-alpine
    container_name: shopify-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-shopify_erp}
    ports:
      # Solo localhost: no exponer la base de datos a la red local (Wi-Fi, LAN).
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
